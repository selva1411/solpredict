name: SOLPredict CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-frontend:
    name: Lint, Type Check & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: app
        run: npm ci

      - name: Run ESLint Checks
        working-directory: app
        run: npm run lint

      - name: Run TypeScript Type Check
        working-directory: app
        run: npx tsc --noEmit

      - name: Run Vitest Unit Tests
        working-directory: app
        run: npm test

      - name: Build Next.js Production App
        working-directory: app
        run: npm run build
        env:
          NEXT_PUBLIC_SOLANA_RPC_URL: https://api.devnet.solana.com
          NEXT_PUBLIC_SOLANA_NETWORK: devnet
          NEXT_PUBLIC_PROGRAM_ID: HNY9PwV2MN6CHACuigCNvRWusfJdDZGgxC3weM4QVaJP

  validate-program:
    name: Build Rust Program & Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Program
        run: cargo build --manifest-path programs/solpredict/Cargo.toml

      - name: Run Rust Unit Tests (AMM math, etc.)
        run: cargo test --manifest-path programs/solpredict/Cargo.toml
